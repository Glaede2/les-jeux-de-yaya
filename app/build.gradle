}

android {
    namespace 'fr.yaya.jeux'
    compileSdk 34

    defaultConfig {
        applicationId 'fr.yaya.jeux'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '1.1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // SignÃ© avec la clÃ© de debug : suffisant pour installer l'APK Ã  la main
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
